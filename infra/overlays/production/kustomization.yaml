apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-task-platform

resources:
  - ../../k8s

images:
  - name: ai-task-backend
    newName: mehdiloriya/ai-task-backend
    newTag: a7e811ace5f316a6fd7f3d1afaafbd15cde16b2f

  - name: ai-task-worker
    newName: mehdiloriya/ai-task-worker
    newTag: a7e811ace5f316a6fd7f3d1afaafbd15cde16b2f

  - name: ai-task-frontend
    newName: mehdiloriya/ai-task-frontend
    newTag: a7e811ace5f316a6fd7f3d1afaafbd15cde16b2f

patches:
  - target:
      kind: Ingress
      name: ai-task-platform-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ai-task-platform.example.com